<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="3)tpc.css">
</head>

<body>
    <form>
        <h1>Temperature Conversion:</h1>
        <input type="number" value="0" id="textbox"><br>

        <input type="radio" name="unit" id="tofahrenheit">
        <label for="tofahrenheit">Celsius ➡️ Fahrenheit</label> <br>

        <input type="radio" name="unit" id="toCelsius">
        <label for="toCelsius">Fahrenheit ➡️ Celsius</label><br>
        <div class="btns">
            <button type="button" id="submitbtn">Submit</button>
            <button type="button" id="resetbtn">Reset</button><br>
        </div>
        <p id="result">Select a unit</p>
    </form>
    <script src="3)tpc.js"></script>
</body>

</html>
